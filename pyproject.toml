[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixrank-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the MixRank data API: companies, headcount history, SDK adoption and email validation for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aniket Kolte" }]
keywords = ["mcp", "model-context-protocol", "mixrank", "b2b-data", "claude-code", "ai-agents"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mixrank-mcp = "mixrank_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mixrank_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
